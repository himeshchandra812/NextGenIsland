name: Windows build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore NextGenIsland.csproj
      - name: Publish self-contained x64
        run: dotnet publish NextGenIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
      - name: Zip output
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath NextGenIsland-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NextGenIsland-win-x64
          path: NextGenIsland-win-x64.zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NextGenIsland-win-x64.zip
          generate_release_notes: true
